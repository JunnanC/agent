name: edu-platform-p00

x-app-environment: &app-environment
  APP_ENV: local
  APP_VERSION: ${APP_VERSION:-0.1.0-p00}
  OPENAPI_REVISION: ${OPENAPI_REVISION:-v2-p00}
  GIT_REVISION: ${GIT_REVISION:-development}
  BUILD_TIME: ${BUILD_TIME:-development}
  DJANGO_SETTINGS_MODULE: education_experiment_platform.settings.integration
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-compose-key-change-me}
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,django,user.localhost,teacher.localhost,admin.localhost,api.localhost,user.example.edu,teacher.example.edu,admin.example.edu,api.example.edu
  DJANGO_TRUSTED_ORIGINS: http://user.localhost:8080,http://teacher.localhost:8080,http://admin.localhost:8080
  TRUSTED_PROXY_CIDRS: 172.29.20.0/24
  MYSQL_DATABASE: ${MYSQL_DATABASE:-edu_platform}
  MYSQL_USER: ${MYSQL_USER:-edu_platform}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-development-password}
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-runtime_logger}:${MONGO_INITDB_ROOT_PASSWORD:-local-mongo-password}@mongodb:27017/observability?authSource=admin&replicaSet=rs0
  MONGODB_LOG_DATABASE: observability
  MONGODB_LOG_COLLECTION: runtime_logs
  MONGODB_LOG_TTL_DAYS: ${MONGODB_LOG_TTL_DAYS:-30}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: ${MINIO_BUCKET:-edu-platform}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  LOG_LEVEL: INFO

x-backend-build: &backend-build
  context: backend
  args:
    PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-m.daocloud.io/docker.io/library/python:3.14-slim}
    DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
    DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}

x-fluentd-logging: &fluentd-logging
  driver: fluentd
  options:
    fluentd-address: localhost:24224
    fluentd-async: "true"
    tag: "edu.{{.Name}}"

services:
  mysql:
    image: ${MYSQL_IMAGE:-public.ecr.aws/docker/library/mysql:8.4}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--binlog-format=ROW"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edu_platform}
      MYSQL_USER: ${MYSQL_USER:-edu_platform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-development-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes: [mysql-data:/var/lib/mysql]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        reservations: { memory: 512M }
        limits: { memory: 1G }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        reservations: { memory: 128M }
        limits: { memory: 512M }

  mongo-keyfile:
    image: mongo:8.0
    user: root
    environment:
      MONGO_REPLICA_SET_KEY: ${MONGO_REPLICA_SET_KEY:-local-replica-set-key-change-this-value-now}
    command: ["bash", "-ec", "printf '%s' \"$$MONGO_REPLICA_SET_KEY\" > /keyfile/keyfile && chmod 400 /keyfile/keyfile && chown 999:999 /keyfile/keyfile"]
    volumes: [mongo-keyfile:/keyfile]
    restart: "no"

  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/keyfile/keyfile", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-runtime_logger}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-local-mongo-password}
    volumes:
      - mongo-data:/data/db
      - mongo-keyfile:/keyfile:ro
    networks: [data]
    depends_on:
      mongo-keyfile: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        reservations: { memory: 256M }
        limits: { memory: 768M }

  mongo-init:
    image: mongo:8.0
    environment:
      MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME:-runtime_logger}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-local-mongo-password}
    command:
      - bash
      - -ec
      - |
        mongosh --host mongodb:27017 --username "$$MONGO_USER" --password "$$MONGO_PASSWORD" --authenticationDatabase admin --eval '
          try { rs.status() } catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}) }
        '
    networks: [data]
    depends_on:
      mongodb: { condition: service_healthy }
    restart: "no"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edu-platform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
    volumes: [minio-data:/data]
    networks: [data]
    ports: ["127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        reservations: { memory: 256M }
        limits: { memory: 768M }

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edu-platform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-edu-platform}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc version enable "local/$$MINIO_BUCKET"
    networks: [data]
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

  clamav:
    image: clamav/clamav:1.4
    volumes: [clamav-data:/var/lib/clamav]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc 127.0.0.1 3310 | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    deploy:
      resources:
        reservations: { memory: 768M }
        limits: { memory: 2G }

  migrate:
    build: *backend-build
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *app-environment
    networks: [app, data]
    depends_on:
      mysql: { condition: service_healthy }
    restart: "no"

  django:
    build: *backend-build
    environment: *app-environment
    networks: [app, data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      fluent-bit: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v2/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *fluentd-logging
    deploy:
      replicas: 2
      resources:
        reservations: { cpus: "0.25", memory: 256M }
        limits: { cpus: "1.00", memory: 768M }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }

  celery:
    build: *backend-build
    command: ["celery", "-A", "education_experiment_platform", "worker", "--loglevel=INFO", "--queues=default,runtime,archive,notifications"]
    environment: *app-environment
    networks: [app, data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      fluent-bit: { condition: service_started }
    logging: *fluentd-logging
    deploy:
      resources:
        reservations: { cpus: "0.25", memory: 256M }
        limits: { cpus: "1.00", memory: 768M }
      update_config: { parallelism: 1, order: stop-first, failure_action: rollback }

  log-ingest:
    build: *backend-build
    command: ["python", "-m", "education_experiment_platform.log_ingest"]
    environment: *app-environment
    networks: [observability, data]
    depends_on:
      mongo-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 256M }

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:4.0.9
    volumes:
      - ./infrastructure/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./infrastructure/fluent-bit/redact.lua:/fluent-bit/etc/redact.lua:ro
      - fluent-bit-buffer:/buffers
    networks: [observability, log-driver]
    ports: ["127.0.0.1:24224:24224"]
    depends_on:
      log-ingest: { condition: service_healthy }
    deploy:
      mode: global
      resources:
        limits: { memory: 256M }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes: [./infrastructure/otel/collector.yml:/etc/otelcol/config.yml:ro]
    networks: [app, observability]
    deploy:
      mode: global
      resources:
        limits: { memory: 384M }

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [app, observability]
    ports: ["127.0.0.1:9090:9090"]
    deploy:
      resources:
        limits: { memory: 512M }

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_NGINX_WORKER_PROCESSES: "2"
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-notice}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: "off"
    volumes: [./infrastructure/kong/kong.yml:/kong/declarative/kong.yml:ro]
    networks: [edge, app]
    depends_on:
      django: { condition: service_healthy }
      fluent-bit: { condition: service_started }
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *fluentd-logging
    deploy:
      replicas: 2
      resources:
        reservations: { cpus: "0.25", memory: 256M }
        limits: { cpus: "1.00", memory: 768M }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }

  nginx:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:24-alpine}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-m.daocloud.io/docker.io/library/nginx:1.29-alpine}
        APP_VERSION: ${APP_VERSION:-0.1.0-p00}
        OPENAPI_REVISION: ${OPENAPI_REVISION:-v2-p00}
        GIT_REVISION: ${GIT_REVISION:-development}
        BUILD_TIME: ${BUILD_TIME:-development}
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    networks: [edge]
    ports: ["8080:8080"]
    depends_on:
      kong: { condition: service_healthy }
      fluent-bit: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health", "--header=Host: user.localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *fluentd-logging
    deploy:
      replicas: 1
      resources:
        reservations: { cpus: "0.10", memory: 64M }
        limits: { cpus: "0.50", memory: 256M }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }

networks:
  edge: {}
  app:
    internal: true
    ipam:
      config:
        - subnet: 172.29.20.0/24
  data: { internal: true }
  observability: { internal: true }
  log-driver: {}

volumes:
  mysql-data: {}
  redis-data: {}
  mongo-data: {}
  mongo-keyfile: {}
  minio-data: {}
  clamav-data: {}
  fluent-bit-buffer: {}
  prometheus-data: {}
