name: CI

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io

jobs:
  # ──────────────────────────────────────────────
  # Backend: lock-check → lint → test
  # ──────────────────────────────────────────────
  backend-check:
    name: "Backend · lock / lint / test"
    runs-on: ubuntu-latest
    container: python:3.14-slim

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: edu_platform_test
          MYSQL_USER: edu_test
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: test_root
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: System deps (mysqlclient)
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            default-libmysqlclient-dev build-essential pkg-config curl
          rm -rf /var/lib/apt/lists/*

      - name: Install dev dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements/dev.txt

      # ── Lock check ──
      - name: Install pip-tools
        run: pip install --no-cache-dir pip-tools==7.6.1

      - name: Lock check — base.txt
        working-directory: backend
        run: |
          pip-compile --no-emit-index-url --output-file=/tmp/base.txt requirements/base.in
          grep -v "^#" requirements/base.txt > /tmp/c.txt
          grep -v "^#" /tmp/base.txt > /tmp/g.txt
          diff /tmp/c.txt /tmp/g.txt

      - name: Lock check — dev.txt
        working-directory: backend
        run: |
          pip-compile --no-emit-index-url --output-file=/tmp/dev.txt requirements/dev.in
          grep -v "^#" requirements/dev.txt > /tmp/c.txt
          grep -v "^#" /tmp/dev.txt > /tmp/g.txt
          diff /tmp/c.txt /tmp/g.txt

      - name: Lock check — prod.txt
        working-directory: backend
        run: |
          pip-compile --no-emit-index-url --output-file=/tmp/prod.txt requirements/prod.in
          grep -v "^#" requirements/prod.txt > /tmp/c.txt
          grep -v "^#" /tmp/prod.txt > /tmp/g.txt
          diff /tmp/c.txt /tmp/g.txt

      # ── Lint ──
      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      # ── Test ──
      - name: Pytest
        working-directory: backend
        env:
          MYSQL_HOST: mysql
          MYSQL_PORT: "3306"
          MYSQL_DATABASE: edu_platform_test
          MYSQL_USER: edu_test
          MYSQL_PASSWORD: test_password
          REDIS_URL: redis://redis:6379/0
          CELERY_BROKER_URL: redis://redis:6379/1
        run: pytest -v --tb=short

  # ──────────────────────────────────────────────
  # Frontend: lock-check → lint → typecheck → test
  # ──────────────────────────────────────────────
  frontend-check:
    name: "Frontend · lock / lint / typecheck / test"
    runs-on: ubuntu-latest
    container: node:24

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ── Lock check (npm ci validates lock consistency) ─
      - name: Lock check — npm ci
        working-directory: frontend
        run: npm ci --ignore-scripts

      # ── Lint ──
      - name: ESLint
        working-directory: frontend
        run: npm run lint

      # ── Type check ──
      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

      # ── Build validation ──
      - name: Build
        working-directory: frontend
        run: npm run build

      # ── Unit test ──
      - name: Vitest
        working-directory: frontend
        run: npm run test

  # ──────────────────────────────────────────────
  # Docker: build & push backend image
  # (nginx image requires TLS certs at runtime, validated in Swarm staging)
  # ──────────────────────────────────────────────
  docker-build:
    name: "Docker · build & push backend"
    needs: [backend-check, frontend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend — build & push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/edu-platform-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
