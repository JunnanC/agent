worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout combined;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream gateway { server kong:8000; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Portal "";
  proxy_set_header X-Auth-Context "";
  proxy_set_header X-Client-Id "";
  proxy_set_header X-Scopes "";
  proxy_set_header X-Proxy-Context "";

  server {
    listen 8080;
    server_name user.localhost user.example.edu;
    root /srv/user-web;
    client_max_body_size 20m;

    location = /api/v2/events/stream {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no always;
    }
    location /api/v2/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 60s; }
    location /workspace/ {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Portal "";
      proxy_set_header X-Auth-Context "";
      proxy_set_header X-Proxy-Context "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 10m;
    }
    location /files/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 5m; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  }

  server {
    listen 8080;
    server_name teacher.localhost teacher.example.edu;
    root /srv/teacher-web;
    client_max_body_size 20m;
    location = /api/v2/events/stream { proxy_pass http://gateway; proxy_http_version 1.1; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; add_header X-Accel-Buffering no always; }
    location /api/v2/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 60s; }
    location /workspace/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Portal ""; proxy_set_header X-Auth-Context ""; proxy_set_header X-Proxy-Context ""; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_buffering off; proxy_read_timeout 10m; }
    location /files/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 5m; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  }

  server {
    listen 8080;
    server_name admin.localhost admin.example.edu;
    root /srv/admin-web;
    client_max_body_size 10m;
    location = /api/v2/events/stream { proxy_pass http://gateway; proxy_http_version 1.1; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; add_header X-Accel-Buffering no always; }
    location /api/v2/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 45s; }
    location /workspace/ { return 403; }
    location /files/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 5m; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  }

  server {
    listen 8080;
    server_name api.localhost api.example.edu;
    client_max_body_size 20m;
    location = /api/v2/integrations/oauth/token { proxy_pass http://gateway; proxy_http_version 1.1; }
    location /api/v2/integrations/open/ { proxy_pass http://gateway; proxy_http_version 1.1; }
    location / { return 404; }
  }

  server { listen 8080 default_server; server_name _; return 421; }
}
