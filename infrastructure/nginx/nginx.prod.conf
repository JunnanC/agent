worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout combined;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream gateway { server kong:8000; }

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Portal "";
  proxy_set_header X-Auth-Context "";
  proxy_set_header X-Client-Id "";
  proxy_set_header X-Scopes "";
  proxy_set_header X-Proxy-Context "";

  server {
    listen 8080;
    server_name user.example.edu teacher.example.edu admin.example.edu api.example.edu;
    return 308 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name user.example.edu;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    root /srv/user-web;
    client_max_body_size 20m;
    location = /api/v2/events/stream { proxy_pass http://gateway; proxy_http_version 1.1; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; add_header X-Accel-Buffering no always; }
    location /api/v2/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 60s; }
    location /workspace/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Portal ""; proxy_set_header X-Auth-Context ""; proxy_set_header X-Proxy-Context ""; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_buffering off; proxy_read_timeout 10m; }
    location /files/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 5m; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name teacher.example.edu;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    root /srv/teacher-web;
    client_max_body_size 20m;
    location = /api/v2/events/stream { proxy_pass http://gateway; proxy_http_version 1.1; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; add_header X-Accel-Buffering no always; }
    location /api/v2/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 60s; }
    location /workspace/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Portal ""; proxy_set_header X-Auth-Context ""; proxy_set_header X-Proxy-Context ""; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_buffering off; proxy_read_timeout 10m; }
    location /files/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 5m; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name admin.example.edu;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    root /srv/admin-web;
    client_max_body_size 10m;
    location = /api/v2/events/stream { proxy_pass http://gateway; proxy_http_version 1.1; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; add_header X-Accel-Buffering no always; }
    location /api/v2/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 45s; }
    location /workspace/ { return 403; }
    location /files/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 5m; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name api.example.edu;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    client_max_body_size 20m;
    location = /api/v2/integrations/oauth/token { proxy_pass http://gateway; proxy_http_version 1.1; }
    location /api/v2/integrations/open/ { proxy_pass http://gateway; proxy_http_version 1.1; }
    location / { return 404; }
  }

  server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    return 421;
  }
}

