# ──────────────────────────────────────────────────────────
# EduTech 生产环境 Docker Compose (Swarm)
# MySQL / Redis 使用服务器已有实例（external network）
# 敏感值通过 Docker secrets 注入，不进入 git
# ──────────────────────────────────────────────────────────

x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-edutech/backend:latest}

x-backend-env: &backend-env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DJANGO_DEBUG: "false"
    DJANGO_ALLOWED_HOSTS: "47.114.40.7,localhost"
    MYSQL_HOST: mysql8
    MYSQL_PORT: "3306"
    MYSQL_NAME: edutech
    MYSQL_USER: edutech
    MINIO_ENDPOINT: "minio:9000"
    MINIO_SECURE: "false"
    MINIO_GENERAL_BUCKET: edutech-general
    MINIO_ARCHIVE_BUCKET: edutech-archive
    MINIO_SNAPSHOT_BUCKET: edutech-snapshot
    MINIO_EXPORT_BUCKET: edutech-export
    TZ: "Asia/Shanghai"

x-backend-secrets: &backend-secrets
  secrets:
    - django_secret_key
    - mysql_password
    - redis_cache_url
    - celery_broker_url
    - minio_access_key
    - minio_secret_key

x-backend-deploy: &backend-deploy
  restart: always
  networks:
    - edutech-net
    - edutech-infra
  depends_on:
    - minio
    - minio-init

x-backend-entrypoint: &backend-entrypoint
  entrypoint: ["/opt/edutech/deploy/docker-entrypoint.sh"]
  volumes:
    - /opt/edutech/deploy/docker-entrypoint.sh:/opt/edutech/deploy/docker-entrypoint.sh:ro

services:
  # ── Django API ──────────────────────────────────────────
  api:
    <<: [*backend-image, *backend-env, *backend-deploy, *backend-secrets, *backend-entrypoint]
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=4
      - --threads=2
      - --worker-class=gthread
      - --timeout=120
      - --graceful-timeout=30
      - --keep-alive=5
      - --access-logfile=-
      - --error-logfile=-
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ── Celery Worker ───────────────────────────────────────
  worker:
    <<: [*backend-image, *backend-env, *backend-deploy, *backend-secrets, *backend-entrypoint]
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=4"]
    healthcheck:
      disable: true
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  # ── Celery Beat ─────────────────────────────────────────
  beat:
    <<: [*backend-image, *backend-env, *backend-deploy, *backend-secrets, *backend-entrypoint]
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    healthcheck:
      disable: true
    deploy:
      replicas: 1

  # ── MinIO 对象存储 ──────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      TZ: "Asia/Shanghai"
    secrets:
      - minio_access_key
      - minio_secret_key
    entrypoint: ["/bin/sh", "-c", "export MINIO_ROOT_USER=$$(cat /run/secrets/minio_access_key) && export MINIO_ROOT_PASSWORD=$$(cat /run/secrets/minio_secret_key) && exec /usr/bin/minio server /data --console-address :9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edutech-net
    deploy:
      resources:
        limits:
          memory: 512M

  minio-init:
    image: quay.io/minio/minio:latest
    depends_on:
      - minio
    secrets:
      - minio_access_key
      - minio_secret_key
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_GENERAL_BUCKET: edutech-general
      MINIO_ARCHIVE_BUCKET: edutech-archive
      MINIO_SNAPSHOT_BUCKET: edutech-snapshot
      MINIO_EXPORT_BUCKET: edutech-export
    entrypoint: ["/bin/sh", "-c", "export MINIO_ACCESS_KEY=$$(cat /run/secrets/minio_access_key) && export MINIO_SECRET_KEY=$$(cat /run/secrets/minio_secret_key) && mc alias set local http://$$MINIO_ENDPOINT $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY && mc mb --ignore-existing local/$$MINIO_GENERAL_BUCKET && mc mb --ignore-existing local/$$MINIO_ARCHIVE_BUCKET && mc mb --ignore-existing local/$$MINIO_SNAPSHOT_BUCKET && mc mb --ignore-existing local/$$MINIO_EXPORT_BUCKET && mc anonymous set none local/$$MINIO_GENERAL_BUCKET && mc anonymous set none local/$$MINIO_ARCHIVE_BUCKET && mc anonymous set none local/$$MINIO_SNAPSHOT_BUCKET && mc anonymous set none local/$$MINIO_EXPORT_BUCKET && echo MinIO buckets initialized"]
    networks:
      - edutech-net

  # ── Nginx 反向代理 ──────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/staticfiles:/var/www/static:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - edutech-net
    deploy:
      resources:
        limits:
          memory: 128M
    restart: always

networks:
  edutech-net:
    driver: overlay
    attachable: true
  edutech-infra:
    external: true

volumes:
  minio-data:
  nginx-logs:

secrets:
  django_secret_key:
    external: true
  mysql_password:
    external: true
  redis_cache_url:
    external: true
  celery_broker_url:
    external: true
  minio_access_key:
    external: true
  minio_secret_key:
    external: true
