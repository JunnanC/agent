[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "education-experiment-platform"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Django==6.1.1",
  "djangorestframework==3.18.1",
  "drf-spectacular==0.30.0",
  "celery==5.6.3",
  "redis==6.4.0",
  "mysqlclient==2.2.7",
  "pymongo==4.15.1",
  "prometheus-client==0.23.1",
  "gunicorn==23.0.0",
  "uvicorn[standard]==0.37.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-django==4.11.1",
  "ruff==0.13.1",
  "pip-tools==7.6.1",
  "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
where = ["education_experiment_platform"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "education_experiment_platform.settings.test"
pythonpath = ["education_experiment_platform"]
testpaths = ["education_experiment_platform"]

[tool.ruff]
target-version = "py314"
line-length = 100
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations"]
