[project]
name = "education-experiment-platform-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "django>=5,<6",
  "djangorestframework>=3,<4",
  "drf-spectacular>=0.27",
  "celery>=5,<6",
  "redis>=5,<7",
  "mysqlclient>=2.2",
  "boto3>=1.34",
  "gunicorn>=22",
  "python-dotenv>=1.1,<2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-django>=4",
  "ruff>=0.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]
exclude = ["*.tests", "*.tests.*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["education_experiment_platform"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = [
  "apps/core/tests",
  "apps/common/tests",
  "apps/identity/tests",
  "apps/membership/tests",
  "apps/runtime/tests",
]
addopts = "-ra -p no:cacheprovider"

[tool.coverage.run]
source = ["apps.core", "apps.common", "apps.identity", "apps.membership"]
omit = [
  "apps/core/tests/*",
  "apps/common/tests/*",
  "apps/identity/tests/*",
  "apps/membership/tests/*",
]
