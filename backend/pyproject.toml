[project]
name = "education-experiment-platform-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "django>=5,<6",
  "djangorestframework>=3,<4",
  "drf-spectacular>=0.27",
  "celery>=5,<6",
  "redis>=5,<7",
  "mysqlclient>=2.2",
  "boto3>=1.34",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.setuptools]
packages = ["config", "apps", "apps.common"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["education_experiment_platform"]

[tool.ruff.format]
quote-style = "double"
