openapi: 3.0.3
info:
  title: Agent Virtual Lab API
  version: 2.0.0
  description: 学生端、教师端和管理端统一 API
paths:
  /api/v2/admin/health:
    get:
      operationId: admin_health_retrieve
      tags:
      - admin
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /health/live:
    get:
      operationId: health_live_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /health/ready:
    get:
      operationId: health_ready_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
