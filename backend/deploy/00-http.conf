# Nginx http-context settings shared by all portal server blocks.
# Include once in the main nginx.conf http{} context, before any server blocks.
# Define api_gateway and workspace_gateway upstream blocks in this context too.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=download_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_write_limit:10m rate=10r/s;
